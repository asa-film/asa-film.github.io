<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>あさのフィルム</title>
<meta name="theme-color" content="#F1F1EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="あさのフィルム">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
/* Layout: 1画面アプリ。上=今月のコンタクトシート（フィルム）、下=タブ（フィルム / 撮る / 気圧） */
:root{
  --paper:#F1F1EE; --surface:#FFFFFF; --ink:#16171B; --muted:#6B6B70; --line:#D6D6D1;
  --red:#C2452D; --red-ink:#FFFFFF; --film:#141416; --frame:#2A2A2E; --hole:#F1F1EE; --label:#F6C9A0;
  --calm:#3F7D6B; --warn:#C9811A; --alert:#C2452D; --sun:#E0A21B; --rain:#4F7FBF; --cloudc:#A3A3A8;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  --serif:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme:dark){:root{
  --paper:#121214; --surface:#1C1C1F; --ink:#EDEDE8; --muted:#9A9A9F; --line:#2E2E33;
  --red:#E0644A; --red-ink:#121214; --film:#000; --frame:#1F1F23; --hole:#3A3A40; --label:#F6C9A0;
  --calm:#6FB8A2; --warn:#E6A84A; --alert:#F07A62; --sun:#F2BE4A; --rain:#7FA8E0; --cloudc:#8A8A90; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

.app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:calc(var(--sat) + 14px);padding-bottom:24px}
.pad{padding-left:max(20px,var(--sal));padding-right:max(20px,var(--sar))}

/* tab bar */
.tabbar{flex:none;position:relative;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-top:1px solid var(--line);background:var(--paper);
  padding:10px max(24px,var(--sal)) calc(10px + var(--sab)) max(24px,var(--sar))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;letter-spacing:.06em}
.tab i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:0}
.tab.on{color:var(--ink);font-weight:700}.tab.on i{opacity:1;background:var(--red)}
.shoot{width:58px;height:58px;flex:none;border-radius:50%;background:var(--red);box-shadow:0 2px 8px rgba(194,69,45,.28);display:grid;place-items:center}
.shoot:active{transform:scale(.95)}
.shoot span{width:24px;height:24px;border-radius:50%;border:3px solid var(--red-ink)}

/* film view */
.mast{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.roll{font-size:10px;letter-spacing:.24em;color:var(--red);font-weight:700}
.mast h1{margin:4px 0 0;font-family:var(--serif);font-weight:600;font-size:30px;letter-spacing:.05em;line-height:1.2}
.sub{margin:4px 0 0;font-size:12px;color:var(--muted)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;background:var(--surface)}
.icon-btn svg{width:18px;height:18px}
.month-nav{display:flex;gap:6px;align-items:center;margin-top:12px}
.month-nav button{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.month-nav button:disabled{opacity:.35}
.wx-chip{margin-left:auto;font-size:12px;display:flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;background:var(--surface);border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

.strip{margin-top:16px;background:var(--film);padding:16px max(12px,var(--sal)) 16px max(12px,var(--sar));position:relative}
.strip::before,.strip::after{content:"";position:absolute;left:10px;right:10px;height:5px;background:repeating-linear-gradient(90deg,var(--hole) 0 8px,transparent 8px 17px)}
.strip::before{top:5px}.strip::after{bottom:5px}
.frames{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.daystrip{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px;margin-bottom:12px}
.dc{position:relative;height:24px;border-radius:3px;background:#26262a;color:#808087;font-size:11px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.dc.on{background:var(--label);color:#3a2a1a;font-weight:700}
.dc.now{outline:1.5px solid var(--red);outline-offset:-1.5px;color:#fff}
.dc.on.now{color:#3a2a1a}
.dc.fut{opacity:.35}
.dc .ev{top:2px;right:2px;bottom:auto;width:5px;height:5px;box-shadow:none}
.strip-empty{margin:0;color:#808087;font-size:12px;text-align:center;padding:10px 0}
.fr{position:relative;aspect-ratio:3/4;background:var(--frame);overflow:hidden;display:block;width:100%}
.fr img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05);display:block}
.fr small{position:absolute;bottom:2px;left:4px;font-size:9px;color:var(--label);letter-spacing:.05em;white-space:nowrap;text-shadow:0 1px 2px #000}
.fr.today{outline:2px solid var(--red);outline-offset:-2px}
.fr.today img{filter:none}
.fr.new{animation:arrive .9s ease-out both}
@keyframes arrive{0%{transform:scale(.6);opacity:0;filter:brightness(2.2)}60%{transform:scale(1.06);opacity:1}100%{transform:none;filter:none}}
.added{margin-top:14px;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--ink);border-radius:16px;padding:10px 10px 10px 10px}
.added img{width:46px;height:62px;object-fit:cover;border-radius:6px;flex:none}
.added .t{flex:1;min-width:0;font-size:13px;line-height:1.5}
.added .t b{display:block;font-size:14px}
.added .btn{flex:none;padding:9px 14px;font-size:13px}
.morning{margin-top:14px;display:flex;align-items:center;gap:12px;font-size:13px;line-height:1.5;padding:10px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.morning img{width:40px;height:54px;object-fit:cover;border-radius:6px;flex:none}
.manual{display:flex;gap:8px;margin-top:10px}
.manual input{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px}
.fr.blank small{color:#77777d;text-shadow:none}
.fr .ev{position:absolute;bottom:4px;right:4px;width:8px;height:8px;border-radius:2px;background:var(--alert);box-shadow:0 0 0 1.5px var(--film)}
.fr.todo{display:grid;place-items:center;color:var(--label);font-size:11px}
.fr.todo b{font-size:20px;line-height:1;font-weight:400}
.fr.mood-grumpy::after,.fr.mood-sleepy::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%}
.fr.mood-sleepy::after{background:#9C8CE0}.fr.mood-grumpy::after{background:#E0644A}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:18px}
.stat{border-top:1px solid var(--ink);padding-top:6px}
.stat b{display:block;font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.3}
.stat span{font-size:10px;color:var(--muted);letter-spacing:.06em}
.play{margin-top:18px;width:100%;display:flex;align-items:center;justify-content:space-between;border:1px solid var(--ink);border-radius:999px;padding:9px 9px 9px 20px;font-size:14px;font-weight:700}
.play i{width:36px;height:36px;border-radius:50%;background:var(--red);display:grid;place-items:center}
.play i::before{content:"";border-left:11px solid var(--red-ink);border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.play:disabled{opacity:.4}
.quote{margin:18px 0 0;font-family:var(--serif);font-size:15px;line-height:1.7}
.quote span{display:block;font-family:var(--sans);font-size:10px;color:var(--muted);letter-spacing:.06em}
.empty-note{margin-top:14px;font-size:13px;color:var(--muted);line-height:1.7}

/* pressure view */
.eyebrow{font-size:10px;letter-spacing:.24em;color:var(--red);font-weight:700}
.wx-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:6px}
.wx-now{font-family:var(--serif);font-size:46px;font-weight:600;line-height:1}
.wx-now small{font-family:var(--sans);font-size:14px;color:var(--muted);margin-left:4px;font-weight:400}
.trend{font-size:13px;color:var(--muted);text-align:right}
.level{margin-top:14px;border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line)}
.level .badge{flex:none;font-size:12px;font-weight:700;color:#fff;border-radius:999px;padding:3px 10px}
.level p{margin:0;font-size:13.5px;line-height:1.7}
.chart{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 10px 6px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);padding:2px 6px 4px;flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.sec-title{margin:26px 0 10px;font-family:var(--serif);font-size:18px;font-weight:600}
.place-btn{margin-top:12px;width:100%;display:flex;align-items:center;gap:6px;flex-wrap:wrap;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;font-size:13.5px;text-align:left}
.place-btn .hint:last-child{margin-left:auto}
.meter{display:inline-flex;gap:3px;vertical-align:middle}
.meter i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block}
.meter.big i{width:14px;height:14px}
.lv-line{display:flex;align-items:center;gap:8px}
.today-lv{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.today-lv .label{font-size:11px;color:var(--muted);letter-spacing:.06em}
.today-lv .lv-line b{font-size:18px;font-family:var(--serif)}
.warn-line{margin:0;font-size:13px;color:var(--alert);font-weight:700}
.kinds{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.kinds button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px}
.kinds button.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.rel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.rel-verdict{margin:0;font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.5;padding-left:10px;border-left:4px solid var(--c)}
.rel-rows{display:flex;flex-direction:column;gap:8px}
.rel-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 8px;align-items:center;font-size:12.5px}
.rel-bar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:block}
.rel-bar i{display:block;height:100%;background:var(--ink);border-radius:4px}
.rel-n{grid-column:1/-1;font-size:11.5px;color:var(--muted);margin-top:-2px}
.tl-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.today-lv .wx-line{margin-top:0;align-items:flex-start}
.today-lv .wx-line b{white-space:nowrap;flex:none}
.today-lv .wx-line .wxi{flex:none;margin-top:1px}
.today-lv .wx-line .t{min-width:0}
.ampm-line,.ampm{display:block;font-size:13px;color:var(--muted)}
.ampm-line{border-top:1px solid var(--line);padding-top:10px}
.ampm-line b,.ampm b{color:var(--ink);font-size:15px}
.ampm-s b{color:var(--ink);font-weight:700}
.down{color:var(--alert);margin-left:2px}.up{color:var(--calm);margin-left:2px}
.rel-wait{margin:0;font-size:13.5px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:10px 14px}
.rel-wait b{color:var(--ink)}
.chart-box{margin-top:22px}
.chart-box summary{cursor:pointer;font-size:13.5px;font-weight:700;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);list-style:none;display:flex;justify-content:space-between}
.chart-box summary::-webkit-details-marker{display:none}
.chart-box summary::after{content:"開く ›";font-weight:400;color:var(--muted)}
.chart-box[open] summary::after{content:"閉じる";}
.chart-box .chart{margin-top:8px}
.status-card{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.status-card p{margin:0}
.pl-list{display:flex;flex-direction:column;gap:6px}
.pl-item{display:flex;align-items:baseline;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;font-size:14px}
.ev-btns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ev-btns button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 4px;font-size:12.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:5px;line-height:1.3;text-align:center}
.ev-btns button .box{width:18px;height:18px;border-radius:5px;border:2px solid var(--line);display:grid;place-items:center}
.ev-btns button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.ev-btns button.on .box{border-color:transparent;background:var(--c)}
.ev-btns button.on .box::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.wx-line{display:flex;align-items:center;gap:8px;font-size:14px;margin-top:6px}
.wx-line .t{color:var(--muted);font-size:13px}
.daycard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.daycard .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px}
.daycard svg[role=img]{width:100%;height:auto;display:block}
.evchip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;color:#fff}
.day{width:100%;text-align:left}
.day .r{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.days{display:flex;flex-direction:column}
.day{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.day .d{font-weight:700}
.day>span:nth-child(2){display:flex;flex-direction:column;gap:4px;min-width:0}
.day .bar{display:block;height:8px;border-radius:4px;background:var(--line);position:relative;overflow:hidden}
.day .bar i{position:absolute;top:0;bottom:0;border-radius:4px}
.day .r{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;margin-left:6px}
.setup{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.setup p{margin:0;font-size:13.5px}
.credit{margin-top:22px;font-size:11px;color:var(--muted)}
.credit a{color:inherit}

/* buttons / forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--ink);border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px;background:transparent}
.btn.fill{background:var(--red);border-color:var(--red);color:var(--red-ink)}
.btn.block{width:100%}
.btn.quiet{border-color:var(--line);font-weight:500}
.btn.danger{background:var(--alert);border-color:var(--alert);color:#fff}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;color:var(--muted);letter-spacing:.06em}
.field input,.field select,.field textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;font-size:16px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* sheets */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:rgba(10,10,12,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:520px;max-height:calc(100% - var(--sat) - 20px);overflow-y:auto;border-radius:22px 22px 0 0;
  padding:18px max(20px,var(--sar)) calc(22px + var(--sab)) max(20px,var(--sal));display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-head h2{margin:0;font-family:var(--serif);font-size:20px;font-weight:600}
.close{font-size:14px;color:var(--muted);padding:6px 4px}
.photo-big{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;background:var(--frame);display:block;max-height:46vh;width:auto;max-width:100%;margin:0 auto}
.moods{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.moods button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 2px;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:4px}
.moods button.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;background:var(--surface)}
.save-photo{display:block;margin:8px auto 0;background:none;border:0;color:var(--ink);font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:6px 10px}
.confirm .swap{display:flex;align-items:center;gap:10px}
.confirm .swap img{width:46px;height:62px;object-fit:cover;border-radius:6px;flex:none}
.confirm{background:var(--surface);border:1px solid var(--alert);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.sticky-actions{position:sticky;bottom:calc(-22px - var(--sab));margin:0 calc(-1 * max(20px,var(--sar))) calc(-22px - var(--sab)) calc(-1 * max(20px,var(--sal)));padding:12px max(20px,var(--sar)) calc(14px + var(--sab)) max(20px,var(--sal));background:var(--paper);border-top:1px solid var(--line);z-index:2}
@media (max-height:700px){.photo-big{max-height:32vh}}
.err{color:var(--alert);font-size:13px;margin:0}
.hint{font-size:12px;color:var(--muted);margin:0;line-height:1.7}

/* camera */
.cam{position:fixed;inset:0;z-index:50;background:#000;color:#fff;display:flex;flex-direction:column}
.cam-top{display:flex;justify-content:space-between;align-items:center;padding:calc(var(--sat) + 10px) max(16px,var(--sar)) 10px max(16px,var(--sal));font-size:14px}
.cam-top button{color:#fff;padding:6px 4px}
.viewer{position:relative;flex:1;overflow:hidden;display:grid;place-items:center}
.viewer .box{position:relative;width:min(100%, calc((100vh - 230px) * .75));aspect-ratio:3/4;max-width:100%;overflow:hidden;background:#111}
.viewer video,.viewer .ghost{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.viewer video.mirror{transform:scaleX(-1)}
.viewer .ghost{opacity:.32;pointer-events:none}
.viewer .guide{position:absolute;left:50%;top:44%;width:56%;height:52%;transform:translate(-50%,-50%);border:2px dashed rgba(255,255,255,.7);border-radius:50%;pointer-events:none}
.cam-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;font-size:14px;line-height:1.7}
.cam-msg .btn{border-color:#fff;color:#fff}
.cam-msg .btn.fill{background:var(--red);border-color:var(--red);color:#fff}

    const v = got[k], np = v.normalPressure && v.normalPressure[0];
    time.push(`${k.slice(0,4)}-${k.slice(4,6)}-${k.slice(6,8)}T${k.slice(8,10)}:00`);
    hpa.push(np == null ? null : np);
    code.push(jmaToWmo(v.weather && v.weather[0]));
    temp.push(v.temp ? v.temp[0] : null);
  }
  const dt = [...new Set(time.map(t => t.slice(0, 10)))], dc = [], tx = [], tn = [];
  for (const d of dt){
    const ix = time.map((t, i) => t.startsWith(d) ? i : -1).filter(i => i >= 0);
    const cs = ix.map(i => code[i]).filter(c => c != null), ts = ix.map(i => temp[i]).filter(t => t != null);
    dc.push(cs.length ? cs.reduce((a, b) => sev(b) > sev(a) ? b : a) : null);
    tx.push(ts.length ? Math.max(...ts) : null); tn.push(ts.length ? Math.min(...ts) : null);
  }
  return { at: Date.now(), lat:p.lat, lon:p.lon, time, hpa, code, temp, daily:{ time:dt, code:dc, tmax:tx, tmin:tn },
    src:"jma", station: st.name, km: st.km };
}

async function fetchWx(force){
  const p = S.settings.place; if (!p) return;
  const fresh = S.wx && S.wx.lat === p.lat && S.wx.lon === p.lon && Date.now() - S.wx.at < 30*60*1000;
  if (fresh && !force) return;
  if (S.wxBusy && !force) return;
  S.wxBusy = true; clearTimeout(S.retryT);
  try {
    // 1) まず今日まわりだけを軽く取って、すぐ表示する（1時間以内につながらなかったら、すぐ気象庁へ）
    let j = null, omErr = null;
    if (!(S.omDownAt && Date.now() - S.omDownAt < 60*60*1000)){
      try { j = await getJSON(wxURL(p, 2), 9000); S.omDownAt = 0; } catch (e) { omErr = e; S.omDownAt = Date.now(); }
    }
    if (!j){
      // 予備：気象庁の観測データ（予報はないが、気圧・天気・気温の実際の値が入る）
      try { S.wx = await fetchJMA(p, Math.min(neededPast(), 14)); }
      catch (e2) { const e = new Error("both"); e.why = `${omErr ? omErr.why + "。" : ""}${e2.why || "気象庁の観測データも取れませんでした"}`; throw e; }
      LS.set("wx", S.wx); S.wxErr = ""; S.wxFails = 0;
      try { await saveDays(); } catch {}
      S.wxBusy = false; render(); return;
    }
    const past = neededPast();
    S.wx = toWx(j, p); LS.set("wx", S.wx); S.wxErr = ""; S.wxFails = 0;
    try { await saveDays(); } catch (e) { S.wxErr = "取った天気の保存でつまずきました。もう一度取ると直ることがあります。"; }
    S.wxBusy = false; render();
    // 2) 抜けている日があれば、あとからまとめて取る（失敗しても今日の表示はそのまま）
    if (past > 2){
      try { const j2 = await getJSON(wxURL(p, past), 40000); S.wx = toWx(j2, p); LS.set("wx", S.wx); await saveDays(); render(); } catch {}
    }
  } catch (e) {
    S.wxFails = (S.wxFails || 0) + 1;
    const wait = [10, 30, 120][Math.min(S.wxFails - 1, 2)];
    S.wxErr = `${e.why || "天気と気圧を取れませんでした"}。${wait < 60 ? wait + "秒" : wait / 60 + "分"}後に自動でもう一度取ります。`;
    S.retryT = setTimeout(() => fetchWx(true), wait * 1000);
    S.wxBusy = false; render();
  }
}
// 取ったデータから「その日の気圧」を日ごとに保存しておく（14日前までさかのぼって毎回うめる）
async function saveDays(){
  const by = {};
  S.wx.time.forEach((t, i) => { const d = t.slice(0,10), v = S.wx.hpa[i]; if (v == null) return; (by[d] = by[d] || []).push(v); });
  const today = todayStr();
  for (const d of Object.keys(by)){
    if (d > today) continue;
    const s = by[d]; if (s.length < (d === today ? 3 : 20)) continue;
    const old = S.days[d] || { date:d };
    const rec = { ...old, date:d, series:s.map(v => Math.round(v*10)/10), min:Math.min(...s), max:Math.max(...s), drop:maxDrop(s) };
    const dl = S.wx.daily, k = dl ? dl.time.indexOf(d) : -1;
    if (k >= 0){ rec.wcode = dl.code[k]; rec.tmax = dl.tmax[k]; rec.tmin = dl.tmin[k]; }
    S.days[d] = rec; await put("days", rec);
  }
}
// 午前（0〜11時）と午後（12〜23時）の平均の気圧
function amPm(series){
  if (!series || !series.length) return null;
  const avg = a => a.length ? Math.round(a.reduce((x, y) => x + y, 0) / a.length) : null;
  return { am: avg(series.slice(0, 12)), pm: avg(series.slice(12)) };
}
function amPmHTML(series, cls){
  const ap = amPm(series); if (!ap || ap.am == null) return "";
  const diff = ap.pm != null ? ap.pm - ap.am : null;
  return `<span class="${cls || "ampm"} num">午前 <b>${ap.am}</b>${ap.pm != null ? ` → 午後 <b>${ap.pm}</b>` : ""} hPa${diff ? `<span class="${diff < 0 ? "down" : "up"}">（${diff > 0 ? "+" : "−"}${Math.abs(diff)}）</span>` : ""}</span>`;
}
// 今の天気（1時間ごとの天気コードと気温）
function wxNow(){

// 1日ぶんの気圧の小さなグラフ（0〜23時）
function sparkSVG(series){
  if (!series || series.length < 4) return "";
  const W = 300, H = 74, L = 30, R = 6, T = 8, B = 18;
  let lo = Math.min(...series), hi = Math.max(...series);
  if (hi - lo < 4){ const m = (hi + lo) / 2; lo = m - 2; hi = m + 2; }
  const xs = i => L + i / 23 * (W - L - R), ys = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  let bands = "";
  for (let i = 0; i + 3 < series.length; i++){ const d = series[i] - series[i+3]; if (d >= 2.4) bands += `<rect x="${xs(i)}" y="${T}" width="${xs(i+3)-xs(i)}" height="${H-T-B}" fill="${d >= 3.2 ? "var(--alert)" : "var(--warn)"}" opacity=".12"/>`; }
  const path = series.map((v,i) => (i ? "L" : "M") + xs(i).toFixed(1) + " " + ys(v).toFixed(1)).join(" ");
  const ticks = [0,6,12,18].map(h => `<text x="${xs(h)}" y="${H-4}" font-size="10" fill="var(--muted)" text-anchor="${h ? "middle" : "start"}">${h}時</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="この日の気圧の移り変わり">${bands}
    <line x1="${L}" x2="${W-R}" y1="${ys(hi)}" y2="${ys(hi)}" stroke="var(--line)"/><line x1="${L}" x2="${W-R}" y1="${ys(lo)}" y2="${ys(lo)}" stroke="var(--line)"/>
    <text x="${L-4}" y="${ys(hi)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${Math.round(hi)}</text>
    <text x="${L-4}" y="${ys(lo)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${Math.round(lo)}</text>
    <path d="${path}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>${ticks}</svg>`;
}
function wxNowIndex(){
  if (!S.wx) return -1;
  const now = new Date(), key = `${ymd(now)}T${pad(now.getHours())}:00`;
  const i = S.wx.time.indexOf(key);
  if (i >= 0 && S.wx.hpa[i] != null) return i;
  for (let k = S.wx.time.length - 1; k >= 0; k--) if (S.wx.time[k] <= key && S.wx.hpa[k] != null && S.wx.time[k].slice(0,10) === key.slice(0,10)) return k;
  return -1;
}
function hpaAt(dateStr, hour){
  if (!S.wx) return null;
  const i = S.wx.time.indexOf(`${dateStr}T${pad(hour)}:00`);
  return i >= 0 && S.wx.hpa[i] != null ? Math.round(S.wx.hpa[i]) : null;
}
function wxSummary(){
  const i = wxNowIndex(); if (i < 0) return null;
  const h = S.wx.hpa, now = h[i], ago = h[i-3];
  const next = h.slice(i, i + 13).filter(v => v != null);
  const drop = maxDrop(next);
  let when = null;
  for (let k = i; k + 3 < Math.min(h.length, i + 13); k++) if (h[k] - h[k+3] >= 3.2) { when = new Date(S.wx.time[k]).getHours(); break; }
  return { now, delta: ago != null ? Math.round((now - ago)*10)/10 : null, drop, when, lv: levelOf(drop) };
}

function chartSVG(){

  if (pts.length < 4) return "";
  const W = 360, H = 190, L = 34, R = 8, T = 12, B = 26;
  let lo = Math.min(...pts.map(p => p[1])), hi = Math.max(...pts.map(p => p[1]));
  lo = Math.floor(lo - 1); hi = Math.ceil(hi + 1); if (hi - lo < 6){ const mid = (hi + lo)/2; lo = Math.floor(mid - 3); hi = Math.ceil(mid + 3); }
  const xs = i => L + (i - from) / (to - from) * (W - L - R);

/* ---------- 1日の気圧の変化（5段階） ---------- */
const LV = [null,
  { n:1, t:"おだやか",     c:"#3F7D6B" },
  { n:2, t:"小さめ",       c:"#86A960" },
  { n:3, t:"ふつう",       c:"#D2A93A" },
  { n:4, t:"大きい",       c:"#D9772B" },
  { n:5, t:"とても大きい", c:"#C2452D" },
];
// 決め方（目安）：「3時間でいちばん下がった幅」と「1日の最高と最低の差」をそれぞれ5段階にして、大きいほう。
// ただし2つが2段階以上ずれるときは1つ下げる（ゆっくり大きく上がる日などが高く出すぎないように）。
// 区切りは、関東の約3か月分の実際の気圧から、毎日ある小さな上下では高くならないように決めた。
function dayLevel(series){
  if (!series || series.length < 3) return null;
  const drop = maxDrop(series), range = Math.round((Math.max(...series) - Math.min(...series)) * 10) / 10;
  const a = drop < 1.3 ? 1 : drop < 1.8 ? 2 : drop < 2.4 ? 3 : drop < 3.2 ? 4 : 5;
  const b = range < 3.5 ? 1 : range < 4.5 ? 2 : range < 6 ? 3 : range < 9 ? 4 : 5;
  const n = Math.abs(a - b) <= 1 ? Math.max(a, b) : Math.max(a, b) - 1;
  return { ...LV[n], drop, range };
}
function meter(lv, big){
  if (!lv) return `<span class="meter${big ? " big" : ""}" aria-label="データなし">${[1,2,3,4,5].map(() => `<i></i>`).join("")}</span>`;
  return `<span class="meter${big ? " big" : ""}" role="img" aria-label="5段階の${lv.n}（${lv.t}）">${[1,2,3,4,5].map(i => `<i style="${i <= lv.n ? `background:${lv.c}` : ""}"></i>`).join("")}</span>`;
}

/* ---------- 気圧との関係（記録の集計） ---------- */
const KINDS = [{ k:"any", t:"ぜんぶ" }, ...EVENTS.map(e => ({ k:e.k, t:e.s }))];
function relation(kind){
  const today = todayStr();
  const isEv = d => { const k = d.kid || {}; return kind === "any" ? !!(k.nurse || k.early || k.headache) : !!k[kind]; };
  const starts = [...S.entries.map(e => e.date), ...Object.values(S.days).filter(d => isEv(d) || (d.kid && d.kid.memo)).map(d => d.date)].sort();
  if (!starts.length) return { total:0, ev:0 };
  const days = Object.values(S.days).filter(d => d.date >= starts[0] && d.date < today && d.series).map(d => ({ d, lv: dayLevel(d.series), ev: isEv(d) }));
  const g = (lo, hi) => { const a = days.filter(x => x.lv.n >= lo && x.lv.n <= hi); return { n:a.length, ev:a.filter(x => x.ev).length }; };
  return { total:days.length, ev:days.filter(x => x.ev).length, big:g(4,5), mid:g(3,3), small:g(1,2), evDays:days.filter(x => x.ev) };
}
function relationHTML(kind){
  const r = relation(kind), name = kind === "any" ? "保健室・早退・頭痛" : EVENTS.find(e => e.k === kind).s;
  if (r.ev < 3 || r.total < 10){
    const need = r.total < 10 ? `あと <b class="num">${10 - r.total}</b>日 記録すると` : `${name}のあった日が あと <b class="num">${3 - r.ev}</b>日 たまると`;
    return `<p class="rel-wait">${need}、結果が出ます</p>`;
  }
  // くらべるのは「変化が大きい日（4・5）」と「それ以外の日（1〜3）」
  const rest = { n: r.mid.n + r.small.n, ev: r.mid.ev + r.small.ev };
  const rate = x => x.n ? x.ev / x.n : null, rb = rate(r.big), rs = rate(rest);
  let verdict, c;
  if (r.big.n < 3 || rest.n < 3){ verdict = "気圧の変化が大きい日と、そうでない日の両方の記録がまだ足りません"; c = "var(--muted)"; }
  else if (rb >= 2 * rs && rb - rs >= 0.2){ verdict = "気圧の変化が大きい日に、起きやすい傾向があります"; c = "var(--alert)"; }
  else if (rb <= rs){ verdict = "今のところ、気圧の変化との関係は見えていません"; c = "var(--calm)"; }
  else { verdict = "少し関係がありそうですが、まだはっきりしません"; c = "var(--warn)"; }
  const row = (label, x, lvn) => `<div class="rel-row num"><span>${meter(LV[lvn])}</span><span>${label}</span>
    <span class="rel-bar"><i style="width:${x.n ? Math.round(x.ev / x.n * 100) : 0}%"></i></span>
    <span class="rel-n">${x.n ? `${x.ev}/${x.n}日（${Math.round(x.ev / x.n * 100)}%）` : "—"}</span></div>`;
  const bigEv = r.evDays.filter(x => x.lv.n >= 4).length;
  return `<div class="rel"><p class="rel-verdict" style="--c:${c}">${verdict}</p>
    <p class="hint num">${name}のあった${r.ev}日のうち <b>${bigEv}</b>日が、変化の大きい日でした。</p>
    <div class="rel-rows">${row("変化が大きい日（4・5）", r.big, 5)}${row("ふつうの日（3）", r.mid, 3)}${row("変化が小さい日（1・2）", r.small, 1)}</div>
    <p class="hint">記録した${r.total}日の集計で、診断ではありません。</p></div>`;
}

function openPlacePicker(){
  if (document.querySelector(".sheet-wrap[data-picker]")) return;   // 2重に開かない
  const cur = S.settings.place;
  const w = sheet(`<div class="sheet-head"><h2>天気と気圧を見る場所</h2><button class="close" type="button" data-close>閉じる</button></div>
    ${cur ? `<p class="hint">いま：<b>${esc(cur.name)}</b>${cur.pref ? `（${esc(cur.pref)}）` : ""}</p>` : ""}
    <form class="field" id="plForm"><label for="plQ">市や町の名前でさがす</label>

    <div class="pl-list" id="plRes"></div>
    <button class="btn quiet" type="button" id="plGeo">今いる場所を使う</button>
    <div class="field"><label for="plPref">都道府県から選ぶ（県庁所在地の天気）</label>
      <select id="plPref"><option value="">選んでください</option>${PREFS.map((c,i) => `<option value="${i}">${c[0]}（${c[1]}）</option>`).join("")}</select></div>

  const err = t => { const e = w.querySelector("#plErr"); e.textContent = t; e.hidden = !t; };
  const done = p => { w.remove(); setPlace(p); S.tab = "wx"; render(); toast(`${p.name} の天気と気圧を入れます`); };
  w.querySelector("#plForm").onsubmit = async ev => {
    ev.preventDefault(); err("");
    const q = w.querySelector("#plQ").value.trim(), box = w.querySelector("#plRes");
    if (!q) return err("市や町の名前を入れてください。");
    box.innerHTML = `<p class="hint">さがしています…</p>`;
    try {
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 10000);
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=10&language=ja&countryCode=JP`, { signal: ctl.signal }).finally(() => clearTimeout(t));
      const j = await r.json();
      const res = (j.results || []).filter(x => /^(PPL|ADM)/.test(x.feature_code || "")).slice(0, 8);
      if (!res.length){ box.innerHTML = ""; return err(`「${q}」は見つかりませんでした。「横浜市」のように「市・町・村」まで入れてみてください。`); }
      box.innerHTML = res.map((x,i) => `<button type="button" class="pl-item" data-i="${i}"><b>${esc(x.name)}</b><span class="hint">${esc(x.admin1 || "")}${x.admin2 && x.admin2 !== x.name ? " " + esc(x.admin2) : ""}</span></button>`).join("");
      box.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { const x = res[+b.dataset.i];
        done({ name:x.name, pref:x.admin1 || "", lat:+x.latitude.toFixed(2), lon:+x.longitude.toFixed(2) }); });
    } catch { box.innerHTML = ""; err("さがせませんでした。通信できる場所で、もう一度ためしてください。"); }
  };
  w.querySelector("#plPref").onchange = e => { const c = PREFS[+e.target.value]; if (c) done({ name:c[1], pref:c[0], lat:c[2], lon:c[3] }); };
  w.querySelector("#plGeo").onclick = () => {
    err("");
    if (!navigator.geolocation) return err("この端末では場所を使えません。名前でさがすか、都道府県から選んでください。");
    const b = w.querySelector("#plGeo"); b.disabled = true; b.textContent = "場所を確かめています…";
    let settled = false;
    const fail = () => { if (settled) return; settled = true; b.disabled = false; b.textContent = "今いる場所を使う";
      err("場所を取れませんでした。スマホの設定で位置情報を許可するか、名前でさがしてください。"); };
    const timer = setTimeout(fail, 15000);   // 許可の画面が閉じられても止まらないように
    navigator.geolocation.getCurrentPosition(
      pos => { if (settled) return; settled = true; clearTimeout(timer); done({ name:"今いる場所", lat:+pos.coords.latitude.toFixed(2), lon:+pos.coords.longitude.toFixed(2) }); },
      () => { clearTimeout(timer); fail(); }, { enableHighAccuracy:false, timeout:10000, maximumAge:3600000 });
  };
  setTimeout(() => { const q = w.querySelector("#plQ"); if (q && !cur) q.focus(); }, 50);
}

/* ---------- レイヤー（シート） ---------- */
function sheet(html){
  const w = document.createElement("div"); w.className = "sheet-wrap";
  w.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  w.addEventListener("click", e => { if (e.target === w || e.target.closest("[data-close]")) w.remove(); });
  $("layer").appendChild(w); return w;
}

function moodButtons(sel){ return MOODS.map(m => `<button type="button" data-mood="${m.k}" class="${sel === m.k ? "on" : ""}"><span class="dot" style="background:${m.c};width:12px;height:12px"></span>${m.t}</button>`).join(""); }

// 撮ったあと：きぶん・ひとことを付けて保存
function openReview(blob, existing, presetDate){
  let date = existing ? existing.date : (presetDate || todayStr());
  const url = URL.createObjectURL(blob);
  let mood = existing?.mood || "sleepy";
  const w = sheet(`<div class="sheet-head"><h2>${existing ? "記録をなおす" : "朝の1コマ"}</h2><button class="close" type="button" data-close>やめる</button></div>
    <img class="photo-big" src="${url}" alt="撮った写真">
    <div class="field"><label for="rvDate">どの日の朝？</label><input id="rvDate" type="date" value="${date}" max="${todayStr()}" ${existing ? "disabled" : ""}></div>
    <p class="hint" id="rvPrev" hidden>この日はもう1枚あります。保存すると、こちらに入れかわります。</p>
    <div class="field"><label>その朝のきぶん</label><div class="moods" id="rvMoods">${moodButtons(mood)}</div></div>
    <div class="field"><label for="rvNote">娘のひとこと（なくてもOK）</label><input id="rvNote" maxlength="60" placeholder="例「きょう体育ある？」" value="${esc(existing?.note || "")}"></div>
    <p class="err" id="rvErr" hidden></p>
    <div class="confirm" id="rvConfirm" hidden><div class="swap"><img id="rvOldImg" alt="今入っている写真"><span>この日には、左の写真がもう入っています。入れかえると、左の写真は消えて元に戻せません。</span></div>
      <div class="actions"><button class="btn quiet" type="button" id="rvNo">やめる</button><button class="btn danger" type="button" id="rvYes">入れかえる</button></div></div>
    <div class="actions sticky-actions" id="rvActs">${existing ? "" : `<button class="btn quiet" type="button" id="rvRetake">撮り直す</button>`}<button class="btn fill" type="button" id="rvSave">保存する</button></div>`);
  const showPrev = () => { w.querySelector("#rvPrev").hidden = existing || !entryOf(date); };
  showPrev();
  w.querySelector("#rvDate").onchange = e => { if (e.target.value && e.target.value <= todayStr()) date = e.target.value; else e.target.value = date; showPrev(); cf.hidden = true; acts.hidden = false; };
  w.querySelector("#rvMoods").onclick = e => { const b = e.target.closest("[data-mood]"); if (!b) return; mood = b.dataset.mood; w.querySelectorAll("[data-mood]").forEach(x => x.classList.toggle("on", x === b)); };
  if (w.querySelector("#rvRetake")) w.querySelector("#rvRetake").onclick = () => { w.remove(); URL.revokeObjectURL(url); openCamera(); };
  const cf = w.querySelector("#rvConfirm"), acts = w.querySelector("#rvActs");
  const askSwap = () => {
    const old = entryOf(date);
    w.querySelector("#rvOldImg").src = urlOf(old);
    cf.hidden = false; acts.hidden = true; cf.scrollIntoView({ block: "nearest" });
  };
  w.querySelector("#rvNo").onclick = () => { cf.hidden = true; acts.hidden = false; };
  w.querySelector("#rvYes").onclick = () => doSave();
  w.querySelector("#rvSave").onclick = () => { if (!existing && entryOf(date)) askSwap(); else doSave(); };
  const doSave = async () => {
    const rec = { date, photo: blob, mood, note: w.querySelector("#rvNote").value.trim(), createdAt: existing?.createdAt || Date.now() };
    try {
      await put("entries", rec);
      if (S.urls[date]) { URL.revokeObjectURL(S.urls[date]); delete S.urls[date]; }
      S.entries = S.entries.filter(e => e.date !== date).concat(rec).sort((a,b) => a.date < b.date ? -1 : 1);
      URL.revokeObjectURL(url); w.remove();
      const d = parse(date); S.view = { y:d.getFullYear(), m:d.getMonth() }; S.tab = "film";
      S.justAdded = existing ? null : date;
      if (!existing && date < todayStr()) fetchWx(true);   // 前の日の写真なら、その日の天気・気圧もさかのぼって取る
      render(); $("main").scrollTop = 0;
      if (existing) toast("なおしました");
    } catch {
      const er = w.querySelector("#rvErr"); er.textContent = "保存できませんでした。スマホの空き容量を確かめて、もう一度押してください。"; er.hidden = false;
    }
  };
}

}
function bindEvButtons(root, date, after){
  root.querySelectorAll("[data-ev]").forEach(b => b.onclick = async () => {
    const key = b.dataset.ev, on = !kidOf(date)[key];
    await setKid(date, { [key]: on });
    b.classList.toggle("on", on); b.setAttribute("aria-pressed", on);
    if (after) after();
  });
}

// 1日ぶんをまとめて見る：顔・娘のようす・天気・気圧
function openDay(date){
  const e = entryOf(date), d = parse(date), day = S.days[date] || {}, k = kidOf(date);
  const mo = e ? MOODS.find(m => m.k === e.mood) : null, w = wxName(day.wcode), isToday = date === todayStr();
  let wxBlock;
  if (day.series){
    const lv = dayLevel(day.series), anyEv = !!(k.nurse || k.early || k.headache);
    const note = !anyEv ? "" : lv.n >= 4
      ? `<p class="warn-line" style="color:${lv.c}">この日は気圧の変化が大きい日でした。気圧が関係しているかもしれません。</p>`
      : lv.n <= 2 ? `<p class="hint">この日は気圧の変化が小さい日でした。ほかの原因も考えられます。</p>`
      : `<p class="hint">この日の気圧の変化は、ふつうくらいでした。</p>`;
    wxBlock = `<div class="daycard">
      <div class="row num">${w ? `${wxIcon(w.i, 22)}<b>${w.t}</b>` : `<b>天気のデータなし</b>`}${day.tmax != null ? `<span class="hint">最高 ${Math.round(day.tmax)}℃ / 最低 ${Math.round(day.tmin)}℃</span>` : ""}</div>
      <div class="row num"><span class="hint">気圧の変化${isToday ? "（予想）" : ""}</span>${meter(lv, true)}<b style="color:${lv.c}">${lv.n} ${lv.t}</b></div>
      <div class="row">${amPmHTML(day.series)}</div>
      ${note}
      ${sparkSVG(day.series)}
    </div>`;
  } else {
    wxBlock = `<div class="daycard"><span class="hint">${day.manual ? `手で入れた気圧 <b class="num">${day.manual} hPa</b>（${esc(day.manualAt || "")}）` : "この日の天気・気圧はまだ取れていません。気圧の画面を開くと、2週間前までさかのぼって入ります。"}</span></div>`;
  }
  const w2 = sheet(`<div class="sheet-head"><h2 class="num">${d.getMonth()+1}月${d.getDate()}日（${WEEK[d.getDay()]}）${isToday ? "<span class=\"hint\" style=\"margin-left:8px\">今日</span>" : ""}</h2><button class="close" type="button" data-close>閉じる</button></div>
    ${e ? `<img class="photo-big" src="${urlOf(e)}" alt="${d.getMonth()+1}月${d.getDate()}日の顔">
      <div class="chips num">${mo ? `<span class="chip"><span class="dot" style="background:${mo.c};display:inline-block;margin-right:5px"></span>朝は${mo.t}</span>` : ""}</div>
      ${e.note ? `<p class="quote" style="margin:0">「${esc(e.note)}」</p>` : ""}
      <button type="button" class="save-photo" id="dySave" style="margin-top:0">iPhoneの写真に保存する</button>`
      : `<button class="btn block" type="button" id="dyAddPhoto">この日の写真を入れる</button>`}
    <div class="field"><label>娘のようす</label>${evButtons(date)}</div>
    <div class="field"><label for="dyMemo">メモ（何時ごろ・どんな様子だったか など）</label>
      <textarea id="dyMemo" rows="2" maxlength="200" placeholder="例 5時間目に保健室。帰ってから頭が痛いと言って横になった">${esc(k.memo || "")}</textarea></div>
    <div class="field"><label>この日の天気と気圧</label>${wxBlock}</div>
    ${e ? `<div class="actions" id="dtActs"><button class="btn quiet" type="button" id="dtDel" style="margin-right:auto;color:var(--alert)">写真を削除</button><button class="btn" type="button" id="dtEdit">きぶん・ひとことをなおす</button></div>
    <div class="confirm" id="dtConfirm" hidden><span>この日の写真ときぶん・ひとことを削除します。娘のようすと天気の記録は残ります。元に戻せません。</span>
      <div class="actions"><button class="btn quiet" type="button" id="dtNo">やめる</button><button class="btn danger" type="button" id="dtYes">削除する</button></div></div>` : ""}`);
  bindEvButtons(w2, date, render);
  const memo = w2.querySelector("#dyMemo"); let saved = k.memo || "";
  const saveMemo = async () => { const v = memo.value.trim(); if (v === saved) return; saved = v; await setKid(date, { memo: v }); render(); toast("メモを保存しました"); };
  memo.addEventListener("blur", saveMemo);
  w2.addEventListener("click", ev => { if (ev.target === w2 || ev.target.closest("[data-close]")) saveMemo(); }, true);
  if (w2.querySelector("#dyAddPhoto")) w2.querySelector("#dyAddPhoto").onclick = async () => { await saveMemo(); w2.remove(); S.pickDate = date; $("fileLib").click(); };
  if (!e) return;
  w2.querySelector("#dySave").onclick = () => savePhotoToDevice(e);
  w2.querySelector("#dtEdit").onclick = async () => { await saveMemo(); w2.remove(); openReview(e.photo, e); };
  w2.querySelector("#dtDel").onclick = () => { w2.querySelector("#dtConfirm").hidden = false; w2.querySelector("#dtActs").hidden = true; };
  w2.querySelector("#dtNo").onclick = () => { w2.querySelector("#dtConfirm").hidden = true; w2.querySelector("#dtActs").hidden = false; };
  w2.querySelector("#dtYes").onclick = async () => {
    await del("entries", date);
    if (S.urls[date]) { URL.revokeObjectURL(S.urls[date]); delete S.urls[date]; }
    S.entries = S.entries.filter(x => x.date !== date); w2.remove(); render(); toast("写真を削除しました");
  };
}

/* ---------- 設定・バックアップ ---------- */
function openSettings(){
  const st = S.settings;
  const w = sheet(`<div class="sheet-head"><h2>設定</h2><button class="close" type="button" data-close>閉じる</button></div>
    <div class="row2">
      <div class="field"><label for="stName">娘の呼び名</label><input id="stName" maxlength="12" value="${esc(st.name)}" placeholder="例 みお"></div>
      <div class="field"><label for="stGrade">今の学年</label><select id="stGrade">${[1,2,3,4,5,6].map(g => `<option value="${g}" ${gradeAt(new Date()) === g ? "selected" : ""}>小学${g}年生</option>`).join("")}</select></div>
    </div>
    <p class="hint">学年は毎年4月に自動で1つ上がります。</p>
    <button class="btn fill block" type="button" id="stSave">保存する</button>
    <div class="field"><label>天気と気圧を見る場所</label>
      <button type="button" class="place-btn" id="stPlace" style="margin-top:0">${st.place ? `<b>${esc(st.place.name)}</b>${st.place.pref ? `<span class="hint">（${esc(st.place.pref)}）</span>` : ""}` : "<b>まだ選んでいません</b>"}<span class="hint">変更 ›</span></button></div>
    <h3 style="margin:10px 0 0;font-family:var(--serif);font-size:17px;font-weight:600">写真の保管</h3>
    <p class="hint">写真はこのスマホの中だけに保存しています。機種変更の前や、月に1回くらいは書き出しておくと安心です。</p>
    <div class="row2"><button class="btn" type="button" id="stExport">書き出す</button><button class="btn" type="button" id="stImport">読み込む</button></div>
    <p class="hint num" id="stUsage"></p>`);
  w.querySelector("#stPlace").onclick = () => { w.remove(); openPlacePicker(); };
  w.querySelector("#stSave").onclick = () => {
    const g = +w.querySelector("#stGrade").value;
    S.settings = { ...S.settings, name: w.querySelector("#stName").value.trim(), grade: g, gradeYear: schoolYear(new Date()) };
    LS.set("settings", S.settings);
    w.remove(); render();
    toast("保存しました");
  };
  w.querySelector("#stExport").onclick = exportAll;
  w.querySelector("#stImport").onclick = () => $("fileBackup").click();
  if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(e => {
    const el = w.querySelector("#stUsage"); if (el) el.textContent = `いまの使用量 約${Math.round((e.usage||0)/1024/1024)}MB ・ 写真 ${S.entries.length}枚`;
  });
}
const toDataURL = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
async function exportAll(){
  const entries = [];
  for (const e of S.entries) entries.push({ ...e, photo: await toDataURL(e.photo) });
  const data = { app:"asa-film", version:1, exportedAt:new Date().toISOString(), settings:S.settings, entries, days:Object.values(S.days) };
  const blob = new Blob([JSON.stringify(data)], { type:"application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `asa-film-${todayStr()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
$("fileBackup").onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const j = JSON.parse(await f.text()); if (j.app !== "asa-film") throw 0;
    for (const x of j.entries || []) { const blob = await (await fetch(x.photo)).blob(); await put("entries", { ...x, photo: blob }); }
    for (const d of j.days || []) await put("days", d);
    if (j.settings) { S.settings = { ...S.settings, ...j.settings }; LS.set("settings", S.settings); }
    $("layer").innerHTML = ""; await loadAll(); toast(`${(j.entries||[]).length}枚の写真を読み込みました`);
  } catch { toast("このファイルは読み込めませんでした"); }
};

/* ---------- カメラ ---------- */
let stream = null, facing = "environment";
function stopStream(){ if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } }
function openCamera(){
  const last = [...S.entries].reverse().find(e => e.date !== todayStr()) || S.entries[S.entries.length-1];
  let ghostOn = !!last;
  const c = document.createElement("div"); c.className = "cam";
  c.innerHTML = `<div class="cam-top"><button type="button" id="cmClose">閉じる</button><span>けさの顔</span><button type="button" id="cmFlip">切りかえ</button></div>
    <div class="viewer"><div class="box">
      <video id="cmVideo" playsinline muted autoplay></video>
      ${last ? `<img class="ghost" id="cmGhost" src="${urlOf(last)}" alt="">` : ""}
      <div class="guide"></div>
      <div class="cam-msg" id="cmMsg" hidden></div>
    </div></div>
    <div class="cam-bottom">
      <button type="button" class="side ${ghostOn ? "on" : ""}" id="cmGhostBtn" ${last ? "" : `style="visibility:hidden"`}>前回を重ねる<br>${ghostOn ? "ON" : "OFF"}</button>
      <button type="button" class="shutter" id="cmShot" aria-label="撮る"><i></i></button>
      <button type="button" class="side" id="cmLib">写真から<br>選ぶ</button>
    </div>`;
  document.body.appendChild(c);
  const video = c.querySelector("#cmVideo"), msg = c.querySelector("#cmMsg");
  const close = () => { stopStream(); c.remove(); };
  c.querySelector("#cmClose").onclick = close;
  c.querySelector("#cmLib").onclick = () => { $("fileLib").click(); };
  const gb = c.querySelector("#cmGhostBtn");
  gb.onclick = () => { ghostOn = !ghostOn; gb.classList.toggle("on", ghostOn); gb.innerHTML = `前回を重ねる<br>${ghostOn ? "ON" : "OFF"}`; const g = c.querySelector("#cmGhost"); if (g) g.hidden = !ghostOn; };
  const showFallback = () => {
    msg.hidden = false;
    msg.innerHTML = `<span>このままではカメラを使えませんでした。<br>スマホのカメラで撮るか、写真を選んでください。</span>
      <button class="btn fill" type="button" id="cmFile">カメラで撮る</button><button class="btn" type="button" id="cmFile2">写真を選ぶ</button>`;
    msg.querySelector("#cmFile").onclick = () => $("fileCam").click();
    msg.querySelector("#cmFile2").onclick = () => $("fileLib").click();
    c.querySelector("#cmShot").disabled = true; c.querySelector("#cmShot").style.opacity = .3;
  };
  const start = async () => {
    stopStream();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return showFallback();
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:facing, width:{ ideal:1440 }, height:{ ideal:1920 } }, audio:false });
      video.srcObject = stream; video.classList.toggle("mirror", facing === "user"); await video.play().catch(() => {});
    } catch { showFallback(); }
  };
  c.querySelector("#cmFlip").onclick = () => { facing = facing === "user" ? "environment" : "user"; start(); };
  c.querySelector("#cmShot").onclick = () => {
    const vw = video.videoWidth, vh = video.videoHeight; if (!vw) return;
    let sw = vw, sh = vw * 4/3; if (sh > vh){ sh = vh; sw = vh * 3/4; }
    const scale = Math.min(1, 1200 / sw), cv = document.createElement("canvas");
    cv.width = Math.round(sw * scale); cv.height = Math.round(sh * scale);
    const ctx = cv.getContext("2d");
    if (facing === "user"){ ctx.translate(cv.width, 0); ctx.scale(-1, 1); }
    ctx.drawImage(video, (vw - sw)/2, (vh - sh)/2, sw, sh, 0, 0, cv.width, cv.height);
    cv.toBlob(b => { if (!b) return; close(); openReview(b); }, "image/jpeg", 0.88);
  };
  S.closeCam = close;
  start();
}
// スマホのカメラ／写真から選んだときは、3:4 に整えて小さくしてから使う
async function fromFile(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const vw = img.naturalWidth, vh = img.naturalHeight;
    let sw = vw, sh = vw * 4/3; if (sh > vh){ sh = vh; sw = vh * 3/4; }
    const scale = Math.min(1, 1200 / sw), cv = document.createElement("canvas");
    cv.width = Math.round(sw * scale); cv.height = Math.round(sh * scale);
    cv.getContext("2d").drawImage(img, (vw - sw)/2, (vh - sh)/2, sw, sh, 0, 0, cv.width, cv.height);
    return await new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(), "image/jpeg", 0.88));
  } finally { URL.revokeObjectURL(url); }
}
["fileCam","fileLib"].forEach(id => $(id).onchange = async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try { const b = await fromFile(f); if (S.closeCam) S.closeCam(); const pd = S.pickDate; S.pickDate = null; openReview(b, null, pd); }
  catch { toast("この写真は読み込めませんでした"); }
});

function render(){
  $("tabFilm").classList.toggle("on", S.tab === "film");
  $("tabWx").classList.toggle("on", S.tab === "wx");
  if (S.tab === "film") renderFilm(); else renderWx();
}
$("tabFilm").onclick = () => { S.tab = "film"; render(); $("main").scrollTop = 0; };
$("tabWx").onclick = () => { S.tab = "wx"; render(); $("main").scrollTop = 0; fetchWx(); };
$("tabShoot").onclick = openCamera;
document.addEventListener("keydown", e => { if (e.key === "Escape") { $("layer").innerHTML = ""; if (S.closeCam && document.querySelector(".cam")) S.closeCam(); } });
document.addEventListener("visibilitychange", () => { if (!document.hidden) fetchWx(); });
window.addEventListener("online", () => fetchWx(true));   // 電波が戻ったらすぐ取り直す

async function loadAll(){
  Object.values(S.urls).forEach(u => URL.revokeObjectURL(u)); S.urls = {};
  S.entries = (await getAll("entries")).sort((a,b) => a.date < b.date ? -1 : 1);
  S.days = {}; (await getAll("days")).forEach(d => S.days[d.date] = d);
  if (S.wx && S.wx.time) { try { await saveDays(); } catch {} }
  render();
}
(async () => {
  try { DB = await openDB(); await loadAll(); }
  catch { $("main").innerHTML = `<div class="pad"><p class="err">写真の保存場所を開けませんでした。プライベートブラウズを切って開き直してください。</p></div>`; }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(() => {});
  if (S.settings.place) fetchWx();
  setInterval(() => fetchWx(), 30 * 60 * 1000);   // 開いたままでも30分ごとに新しくする
})();
})();
